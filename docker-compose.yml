services:

  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "6333:6333"   # REST API + веб-дашборд: http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

#  docling:
#    image: quay.io/docling-project/docling-serve
#    ports:
#      - "5001:5001"
#    command: docling-serve run --host 0.0.0.0 --port 5001 --workers 1 --timeout-keep-alive 600
#    restart: unless-stopped
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
#      interval: 10s
#      timeout: 5s
#      retries: 10
#      start_period: 120s

  morag-indexer:
    build:
      context: .
      network: host
    command: serve
    depends_on:
      qdrant:
        condition: service_healthy
      embedder-gte:
        condition: service_healthy
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data:ro
    restart: unless-stopped

  embedder-gte:
    build:
      context: services/embedder_gte
      network: host
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  pipelines:
    build:
      context: services/pipeline
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9099:9099"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=chunks
      - QDRANT_NUM_RESULTS=50
      - NEIGHBOR_WINDOW=1
      - SPARSE_EMBED_URL=http://embedder-gte:8081
      # Dense: Qwen3-Embedding-4B через Ollama на хосте
      - DENSE_EMBED_URL=${DENSE_EMBED_URL:-http://host.docker.internal:11434}
      - DENSE_EMBEDDER_MODEL=${DENSE_EMBEDDER_MODEL:-qwen3-embedding:4b}
      - DENSE_ENCODING_FORMAT=${DENSE_ENCODING_FORMAT:-base64}
      - QUERY_TEMPLATE=${QUERY_TEMPLATE:-Instruct: Given a user question, retrieve passages that answer the question\nQuery:{text}}
      - LLM_URL=${LLM_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen3.5:9b}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - ENABLE_THINKING=${ENABLE_THINKING:-false}
      - ENABLE_DIVERSITY_NUDGE=${ENABLE_DIVERSITY_NUDGE:-false}
      - MAX_ITERATIONS=32
    depends_on:
      qdrant:
        condition: service_healthy
      embedder-gte:
        condition: service_healthy
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://pipelines:9099
      - OPENAI_API_KEY=0p3n-w3bu!
      - WEBUI_AUTH=False
    depends_on:
      - pipelines
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped

volumes:
  qdrant_data:
  open_webui_data:
