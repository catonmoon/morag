services:

  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "6333:6333"   # REST API + веб-дашборд: http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

#  docling:
#    image: quay.io/docling-project/docling-serve
#    ports:
#      - "5001:5001"
#    command: docling-serve run --host 0.0.0.0 --port 5001 --workers 1 --timeout-keep-alive 600
#    restart: unless-stopped
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
#      interval: 10s
#      timeout: 5s
#      retries: 10
#      start_period: 120s

  morag-indexer:
    build:
      context: .
      network: host
    command: serve
    extra_hosts:
      # Доступ к Ollama на хосте — embedder/LLM могут ходить через host.docker.internal.
      - "host.docker.internal:host-gateway"
    expose:
      # Control-plane HTTP только в docker-network. Console обращается по этому порту.
      - "9090"
    environment:
      # Control-plane HTTP-сервер для приёма команд от console (start/stop/status).
      - MORAG_CONTROL_PORT=9090
      - MORAG_STATUS_FILE=/app/data/morag_state/index_status.json
    depends_on:
      qdrant:
        condition: service_healthy
      embedder-gte:
        condition: service_healthy
    volumes:
      - ./config.yml:/app/config.yml:ro
      # config.local.yml — overlay редактируемый через console UI. Если файла нет на хосте,
      # перед `docker compose up` сделай `touch config.local.yml` (иначе docker создаст директорию).
      - ./config.local.yml:/app/config.local.yml:ro
      # data: рw для записи state-file (./data/morag_state/index_status.json) +
      # папка с документами для local-source. ВСЕГДА примонтирована — local-source
      # в Console UI зашит на /app/data без вариаций. Для других папок — править
      # этот mount + path в config.local.yml вручную.
      - ./data:/app/data:rw
    restart: unless-stopped

  morag-console:
    build:
      context: .
      dockerfile: services/console/Dockerfile
      network: host
    ports:
      # Bind ТОЛЬКО на localhost — UI без auth, наружу выставлять опасно.
      - "127.0.0.1:8000:8000"
    environment:
      - MORAG_CONFIG_PATH=/data/config.yml
      # HTTP control-plane индексера в docker-network
      - MORAG_INDEXER_URL=http://morag-indexer:9090
      - QDRANT_DASHBOARD_URL=http://localhost:6333/dashboard
      - OPENWEBUI_URL=http://localhost:3000
    volumes:
      # Только конфиги — console больше не запускает subprocess'ы и не пишет state.
      # config.local.yml mount должен указывать на существующий файл (touch заранее).
      - ./config.yml:/data/config.yml:ro
      - ./config.local.yml:/data/config.local.yml:rw
      # data ro — console читает /app/data чтобы показать список файлов
      # для local-source (см. /api/setup/local-source-files).
      - ./data:/app/data:ro
    depends_on:
      morag-indexer:
        condition: service_started
    restart: unless-stopped

  embedder-gte:
    build:
      context: services/embedder_gte
      network: host
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  pipelines:
    build:
      context: .
      dockerfile: services/pipeline/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9099:9099"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=chunks
      - QDRANT_NUM_RESULTS=50
      - NEIGHBOR_WINDOW=1
      - SPARSE_EMBED_URL=http://embedder-gte:8081
      # URL'ы и API-ключи — без hardcoded defaults. Задавай через .env / shell export
      # перед `docker compose up`. Pipeline валит fail-fast если что-то пустое.
      # DENSE_EMBED_URL обязательно с /v1 (AsyncOpenAI SDK добавляет только '/embeddings').
      - DENSE_EMBED_URL=${DENSE_EMBED_URL}
      - DENSE_EMBEDDER_MODEL=${DENSE_EMBEDDER_MODEL:-qwen3-embedding:4b}
      - DENSE_DIM=${DENSE_DIM:-2560}
      # QUERY_TEMPLATE: дефолт в pipeline.py (Qwen3 Instruct, совместимый с indexing).
      # Override через OWUI Admin → Pipelines → Valves если нужно.
      - LLM_URL=${LLM_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - ENABLE_THINKING=${ENABLE_THINKING:-false}
      - ENABLE_DIVERSITY_NUDGE=${ENABLE_DIVERSITY_NUDGE:-false}
      - MAX_ITERATIONS=32
    depends_on:
      qdrant:
        condition: service_healthy
      embedder-gte:
        condition: service_healthy
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://pipelines:9099
      - OPENAI_API_KEY=0p3n-w3bu!
      - WEBUI_AUTH=False
    depends_on:
      - pipelines
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped

volumes:
  qdrant_data:
  open_webui_data:
