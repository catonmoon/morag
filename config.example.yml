sources:
  local_documents:
    path: examples              # готовые тестовые документы; замените на свой путь
  confluence:
    url: https://your-company.atlassian.net   # или https://confluence.your-company.com для on-premise
    username: your-email@example.com
    api_token: your-api-token                 # Atlassian Cloud: токен из id.atlassian.com/manage-profile/security/api-tokens
    # password: your-password                 # on-premise: пароль (вместо api_token)
    # spaces: [ML, DEV]                       # индексировать только эти space key; пусто — все доступные
    # ancestor_ids: ["123456", "789012"]       # индексировать только потомков этих страниц (приоритет над spaces)
    # skip_ancestor_ids: ["333444"]            # исключить эти страницы и всех их потомков
    # min_image_size_bytes: 3072              # пропускать изображения меньше N байт (SVG всегда пропускаются); не задано — без фильтрации
    # timeout: 180                            # таймаут HTTP-запросов к Confluence API (секунды; по умолчанию 180)
    # attachments:                            # обработка вложений (PDF и др.) — требует секцию pdf
    #   enabled: true                         # по умолчанию false
    #   mime_types:                           # фильтр по MIME-типу (по умолчанию только PDF)
    #     - application/pdf
    #   skip_ancestor_ids: ["123456"]         # пропускать вложения со страниц-потомков этих разделов
    #   url_mode: preview                     # preview (on-premise, по умолчанию) | download | parent_page
  # jira — индексация задач, найденных в других источниках (опционально)
  # Задачи обнаруживаются автоматически по ссылкам вида {url}/browse/PROJ-123
  # в уже проиндексированных документах Confluence и Markdown
  # jira:
  #   url: https://your-company.atlassian.net   # тот же хост, что и Confluence (или отдельный Jira)
  #   username: your-email@example.com
  #   api_token: your-api-token                 # Atlassian Cloud
  #   # password: your-paисследуй тот гигпокаssword                 # on-premise
  #   # timeout: 180                            # таймаут HTTP-запросов (секунды; по умолчанию 180)

qdrant:
  host: localhost
  port: 6333
  collection_docs: docs
  collection_chunks: chunks

# LLM для текстовых задач (чанкинг, контекст, саммари)
# Рекомендуется: qwen3.5:9b через Ollama — нативно мультимодальная модель,
# используется и для текста, и для vision (см. llm_vision ниже).
# Установка: ollama pull qwen3.5:9b
llm:
  base_url: http://localhost:11434/v1
  model: qwen3.5:9b
  api_key: ollama
  # timeout: 180                  # таймаут HTTP-запросов к LLM (секунды; по умолчанию 180)
  # context_window: 32768         # контекстное окно модели в токенах (по умолчанию 32768)
  # retry:                        # политика повторных попыток при ошибках LLM
  #   max_retries: 3              # количество повторов (0 = без retry; по умолчанию 3)
  # model_wait_seconds: 300       # ожидание перезагрузки модели (сек; 0 = не ждать)
  # model_wait_retries: 3         # количество попыток ожидания модели
  # enable_thinking: false        # отключить thinking-режим (для thinking-моделей; по умолчанию не задано)

# llm_vision — multimodal LLM для описания изображений из Confluence и конвертации PDF
# Рекомендуется: та же qwen3.5:9b — нативно мультимодальная, не нужна отдельная VL-модель.
# Для thinking-моделей обязательно enable_thinking: false (OCR — перцептивная задача,
# thinking тратит бюджет max_tokens на рассуждения вместо полезного контента).
# Если не задан, изображения пропускаются при индексации.
llm_vision:
  base_url: http://localhost:11434/v1
  model: qwen3.5:9b
  api_key: ollama
  enable_thinking: false           # отключить thinking для OCR-задач
  # timeout: 180                   # таймаут HTTP-запросов (секунды; по умолчанию 180)
  # model_wait_seconds: 300        # ожидание перезагрузки модели (сек; 0 = не ждать)
  # model_wait_retries: 3          # количество попыток ожидания модели

# pdf — конвертация PDF → Markdown (опционально)
# Если не задан, PDF-файлы пропускаются при индексации.
# Два режима:
#   vision  — каждая страница рендерится в PNG и отправляется в llm_vision (требует llm_vision)
#   docling — конвертация через docling-serve + Vision LLM для изображений/формул
# Рекомендуется: vision с qwen3.5:9b — сопоставимое с docling качество, проще деплой.
pdf:
  mode: vision                       # 'docling' | 'vision'
  dpi: 144                           # разрешение рендеринга страниц (vision-режим; по умолчанию 144)
  page_max_tokens: 8192              # лимит токенов ответа LLM на страницу (vision-режим; по умолчанию 4096)
  concurrency: 16                    # параллельных запросов к Vision LLM (vision-режим; по умолчанию 1)
  temperature: 0.1                   # немного вариативности (0.0 может кэшироваться на некоторых серверах)
  repetition_penalty: 1.2            # штраф за повторы (>1.0 штрафует; для omlx/vLLM)
  context_tail_lines: 0              # 0 = выключен; >0 = передать N последних строк предыдущей страницы
  postprocessing:
    strip_code_fences: true          # удалить orphan code fences из ответов Vision LLM
    dedup:
      enabled: true                  # программная дедупликация после генерации
      threshold: 0.7                 # порог fuzzy-сходства (0..1)
      window: 5                      # скользящее окно межабзацной дедупликации
      min_phrase_len: 20             # мин. длина фразы для дедупликации
  # docling:                         # настройки docling-serve (только для mode: docling)
  #   base_url: http://localhost:5001
  #   timeout: 300                   # таймаут конвертации (секунды; по умолчанию 300)

indexing:
  chunker:
    mode: hybrid                  # hybrid | semantic | passthrough | llm
    min_tokens: 32                # мин. размер чанка (hybrid/semantic)
    max_tokens: 256               # макс. размер чанка (hybrid/semantic)
    # oversized:                  # стратегии для oversized блоков по типу (hybrid)
    #   table: transform          # строка → key-value текст → рекурсия (default: transform)
    #   list: split               # по элементам списка (default: split)
    #   paragraph: split          # по предложениям (default: split)
    #   fence: asis               # код как есть (default: asis)
    #   diagram: asis             # диаграмма как есть (default: asis)
    #   # варианты: asis | split | embed | transform | llm
    # block_limit: 32000         # лимит токенов для pre-split блока (в llm-режиме ограничивается: min(block_limit, (context_window - 512) / 2))
    # halving_retries: 3         # деления блока пополам при таймауте LLM (0 = выключено)
    # fallback: false            # семантический fallback при исчерпании всех попыток
  context:
    mode: llm                    # noop | llm
    chunk_max_tokens: 512        # макс. токенов на чанк (text + context + path); context адаптивный: chunk_max - text - path_overhead
    # max_tokens: 256            # явный лимит ответа LLM (перекрывает адаптивный); не задано — адаптивный от chunk_max_tokens
    # window_tokens: 2048        # окно текста вокруг позиции чанка (токены); не задано — весь документ

  # Dense-эмбеддер (FRIDA)
  # По умолчанию: локальная модель (загружается напрямую через sentence-transformers)
  # HTTP-режим: раскомментировать base_url и dim (например, embedder-frida из docker-compose)
  dense_embedder:
    model: ai-forever/FRIDA
    # base_url: http://localhost:8082   # если задан → HTTP-режим
    # dim: 1536                         # обязателен в HTTP-режиме
    # timeout: 30                       # таймаут HTTP-запросов (секунды; по умолчанию 30)
    # retry:                            # политика retry (только в HTTP-режиме)
    #   max_retries: 3

  # Sparse-эмбеддер (GTE)
  # По умолчанию: локальная модель (загружается напрямую через transformers)
  # HTTP-режим: раскомментировать base_url (например, embedder-gte из docker-compose)
  sparse_embedder:
    model: Alibaba-NLP/gte-multilingual-base
    # device: cpu                       # cpu | cuda | (не задано = авто; только в local-режиме)
    # base_url: http://localhost:8081   # если задан → HTTP-режим
    # timeout: 30                       # таймаут HTTP-запросов (секунды; по умолчанию 30)
    # retry:                            # политика retry (только в HTTP-режиме)
    #   max_retries: 3

  # vision_max_tokens: 1024       # лимит токенов ответа Vision LLM для изображений и формул (по умолчанию 1024)
  # concurrency: 1                # количество документов, обрабатываемых параллельно (по умолчанию 1)

  # Название документа (опционально)
  # Определяет название документа через LLM по первым scan_tokens токенам текста.
  # Результат сохраняется в payload['title'].
  doc_title:
    max_tokens: 64               # лимит токенов ответа; не задано — генерация отключена
    # scan_tokens: 32768         # глубина просмотра документа (по умолчанию 32768)

  # Саммари документов (опционально)
  # Генерирует payload['doc_summary'] для каждого документа через LLM.
  # Учитывает иерархию: если у документа есть родители, их саммари включается в промпт.
  # Retry для LLM-вызовов наследуется из секции llm.retry.
  doc_summary:
    max_tokens: 256              # лимит токенов ответа; не задано — генерация отключена
