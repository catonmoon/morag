# ============================================================================
# Шаблон конфига morag (schema_version=1, см. ADR-0012).
#
# 1. Скопируй: cp config.example.yml config.yml
# 2. Создай overlay для секретов:  touch config.local.yml
# 3. Любая правка через Console UI (http://localhost:8000) или вручную в
#    config.local.yml — её содержимое deep-merge'ится поверх config.yml.
#
# config.yml и config.local.yml — оба gitignored (см. .gitignore).
# ============================================================================

schema_version: 1

# ----------------------------------------------------------------------------
# Sources — список источников документов. Каждый со своим kind и уникальным name.
# Document IDs в Qdrant префиксятся: <kind>:<name>:<external_id> — гарантирует
# уникальность между инстансами одного типа (multi-Confluence, multi-Jira).
# ----------------------------------------------------------------------------
sources:
  - kind: local
    name: docs
    path: examples              # готовые тестовые документы; замените на свой путь
    # enabled: true             # default; false — временно отключить без удаления конфига

  # Несколько local-инстансов — пожалуйста:
  # - kind: local
  #   name: archive
  #   path: data/old-pdfs/

  # ---- Confluence (Cloud или on-premise) ----
  # - kind: confluence
  #   name: corp                                # human-id, уникальный среди confluence-инстансов
  #   url: https://your-company.atlassian.net   # Cloud, или https://confluence.your-company.com on-premise
  #   username: your-email@example.com
  #   api_token: your-api-token                 # Atlassian Cloud
  #   # password: your-password                 # on-premise (вместо api_token)
  #   # spaces: [ML, DEV]                       # space keys; пусто — все доступные
  #   # ancestor_ids: ["123456"]                # индексировать только потомков; приоритет над spaces
  #   # skip_ancestor_ids: ["333444"]
  #   # min_image_size_bytes: 3072
  #   # timeout: 180
  #   # attachments:                            # PDF-вложения (требует секцию pdf)
  #   #   enabled: true
  #   #   mime_types: [application/pdf]
  #   #   skip_ancestor_ids: ["123456"]
  #   #   url_mode: preview                     # preview | download | parent_page

  # Вторая Confluence-инстанса — multi-Confluence работает из коробки:
  # - kind: confluence
  #   name: vendor
  #   url: https://vendor.atlassian.net/
  #   ...

  # ---- Jira (только on-premise) ----
  # Задачи обнаруживаются автоматически по ссылкам {url}/browse/PROJ-123
  # в уже-проиндексированных документах (Confluence, Markdown).
  # - kind: jira
  #   name: internal
  #   url: https://jira.your-company.com
  #   username: your-username
  #   password: your-password
  #   # custom_fields: ['customfield_10100']

  # Multi-Jira: один JiraLinkExtractor на инстанс, ссылки роутятся по base_url
  # - kind: jira
  #   name: vendor-tracker
  #   url: https://vendor-jira.local/
  #   ...


# ----------------------------------------------------------------------------
# LLMs — пул именованных LLM. Один инстанс описан раз, переиспользуется
# через role mapping в indexing.llm/.vision.
#
# capabilities — declarative объявление того что модель умеет.
#   ['text']         — text-only (default если не указано)
#   ['text', 'vision'] — multimodal (можно использовать и для indexing.vision)
# Validator проверяет что indexing.vision указывает на vision-capable LLM.
# ----------------------------------------------------------------------------
llms:
  - name: main
    base_url: http://host.docker.internal:11434/v1   # Ollama на хосте; локально: http://localhost:11434/v1
    model: qwen3:4b                                  # рекомендуется. ollama pull qwen3:4b
    api_key: ollama                                  # Ollama игнорирует, но OpenAI SDK требует
    enable_thinking: false                           # отключаем для thinking-моделей (qwen3 думает по умолчанию)
    capabilities: [text]                             # default — text-only
    # timeout: 180
    # context_window: 32768
    # max_concurrent: 4                              # потолок параллельных запросов
    # model_wait_seconds: 300                        # ожидание загрузки модели в Ollama
    # model_wait_retries: 3

  # Multimodal LLM для vision-задач (PDF-страницы, Confluence images).
  # Если используешь Ollama qwen3-vl — можно указать `capabilities: [text, vision]`
  # на инстансе main и убрать отдельный vision-инстанс.
  - name: vision
    base_url: http://host.docker.internal:11434/v1
    model: qwen2.5-vl:7b                             # пример; для теста подойдёт любой VL
    api_key: ollama
    enable_thinking: false                           # OCR — перцептивная задача, thinking тратит токены впустую
    capabilities: [text, vision]                     # обязательно vision для роли indexing.vision

  # Примеры альтернативных провайдеров (закомментированы):
  #
  # - name: grok                                     # xAI Grok через api.x.ai
  #   base_url: https://api.x.ai/v1
  #   model: grok-4-1-fast-non-reasoning
  #   api_key: xai-...
  #   context_window: 256000
  #   max_concurrent: 8
  #
  # - name: openrouter
  #   base_url: https://openrouter.ai/api/v1
  #   model: anthropic/claude-haiku-4.5
  #   api_key: sk-or-...
  #   capabilities: [text, vision]                   # Claude умеет vision


# ----------------------------------------------------------------------------
# Qdrant
# ----------------------------------------------------------------------------
qdrant:
  host: qdrant                    # Docker; для нативного запуска: localhost
  port: 6333
  collection_docs: docs
  collection_chunks: chunks


# ----------------------------------------------------------------------------
# PDF — конвертация PDF → Markdown (опционально).
# Если не задана секция, PDF-файлы пропускаются при индексации.
# Использует LLM из indexing.vision (см. ниже).
# ----------------------------------------------------------------------------
pdf:
  mode: vision                       # 'docling' | 'vision'
  dpi: 144                           # разрешение рендеринга страниц (vision-режим)
  page_max_tokens: 8192              # лимит токенов ответа LLM на страницу (vision-режим)
  concurrency: 4                     # параллельных запросов к Vision LLM
  temperature: 0.1                   # немного вариативности (0.0 может кэшироваться на серверах)
  repetition_penalty: 1.2            # штраф за повторы (>1.0; для vLLM/MLX)
  context_tail_lines: 0              # 0 = выключен; >0 = передать N последних строк предыдущей страницы
  postprocessing:
    strip_code_fences: true          # удалить orphan code fences из ответов Vision LLM
    dedup:
      enabled: true                  # программная дедупликация после генерации
      threshold: 0.7
      window: 5
      min_phrase_len: 20
  # docling:                         # настройки docling-serve (только для mode: docling)
  #   base_url: http://localhost:5001
  #   timeout: 300


# ----------------------------------------------------------------------------
# Indexing — роли LLM + чанкинг + embedders + KM.
# ----------------------------------------------------------------------------
indexing:
  # LLM-роли:
  #   llm     — text-роли (DocTitle, DocSummary, ContextGen, KM, LLMChunker)
  #   vision  — multimodal-роли (PDF-страницы, Confluence images)
  llm: main                          # короткая форма: default для всех indexing text-ролей
  vision: vision                     # имя из llms-pool, должен иметь capability=vision
  #
  # Расширенная форма llm с per-role overrides:
  # llm:
  #   default: main
  #   overrides:
  #     doc_summary: smart           # для саммари — умнее модель
  #     knowledge_map: smart
  #     # context_generation, doc_title, chunker — наследуют default

  schedule: '0 */6 * * *'            # cron для serve-режима; не задан — только on-demand

  chunker:
    mode: hybrid                     # hybrid | section | semantic | passthrough | llm
    min_tokens: 32
    max_tokens: 256
    oversized:                       # стратегии для oversized блоков (hybrid)
      table: transform               # строка → key-value текст → рекурсия
      list: split                    # по элементам
      paragraph: split               # по предложениям
      fence: asis                    # код как есть
      diagram: asis                  # диаграмма как есть
      # варианты: asis | split | embed | transform | llm
    # block_limit: 32000             # лимит токенов pre-split (в llm-режиме capped: (context_window-512)/2)
    # halving_retries: 3             # деления блока пополам при таймауте LLM
    # fallback: false                # семантический fallback при исчерпании попыток

  context:
    mode: llm                        # noop | llm
    window_tokens: 2048              # окно текста вокруг чанка (токены); не задано — весь документ
    # chunk_max_tokens: 512          # макс. токенов на чанк (text + context + path)
    # max_tokens: 256                # явный лимит ответа LLM

  # Dense-эмбеддер (Qwen3-Embedding-4B через Ollama). См. ADR-0011.
  dense_embedder:
    model: qwen3-embedding:4b
    tokenizer: Qwen/Qwen3-Embedding-4B               # HF-токенизатор для точного подсчёта в чанкере
    base_url: http://host.docker.internal:11434/v1   # Docker; локально: http://localhost:11434/v1
    dim: 2560                                        # native dim Qwen3-Embedding-4B
    timeout: 180
    document_template: '{text}'
    query_template: "Instruct: Given a user question, retrieve passages that answer the question\nQuery:{text}"

  # Sparse-эмбеддер (GTE).
  sparse_embedder:
    model: Alibaba-NLP/gte-multilingual-base
    base_url: http://embedder-gte:8081               # Docker; для нативного запуска: закомментировать

  embed_batch_size: 64
  concurrency: 4                     # параллельная обработка документов
  # lexical_doc_summary: false       # добавлять doc_summary в лексические векторы

  # Название документа (опционально)
  doc_title:
    max_tokens: 64                   # лимит ответа; не задано — генерация отключена
    # scan_pages: 3                  # для PDF: первые N страниц

  # Саммари документов (опционально)
  doc_summary:
    max_tokens: 512                  # не задано — генерация отключена

  # Knowledge Map (карта документации, ADR-0010)
  knowledge_map:
    enabled: true
    depth: 2                         # уровней в системном промпте
    prompt_strategy: weighted        # 'fixed' | 'weighted' | 'flat_topics'
    prompt_budget: 8192              # для weighted: общий бюджет токенов
    node_min_tokens: 256             # для weighted: минимальный бюджет на узел
    # node_max_tokens: 256           # для fixed: лимит на узел
    # depth1_section_ids: ["12345"]  # разделы с depth=1: только сам раздел, без потомков
    # flat_topics_target: 20         # целевое число тем (для plain-структуры)
    # flat_topics_assign_batch: 5
    # flat_topics_max_input_docs: 3000
